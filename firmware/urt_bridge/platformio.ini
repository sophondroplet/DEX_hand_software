; Dexhand URT bridge firmware (ESP32-S3-DevKitC-1 N32R16V). See README section "ESP32-S3 bridge".
;
;   pio run -e esp32s3                       build
;   pio run -e esp32s3 -t upload --upload-port <DevKit "UART" port>
;   pio device monitor -p <DevKit "UART" port>   bridge log (115200)
;   pio test -e native                       host unit tests of the sniffer and watchdog

[platformio]
default_envs = esp32s3

[env]
test_build_src = yes

[env:esp32s3]
platform = espressif32@6.6.0
board = esp32-s3-devkitc-1
framework = arduino
; N32R16V: 32 MB octal flash + 16 MB octal PSRAM; without OPI settings the module does not boot.
board_build.arduino.memory_type = opi_opi
board_build.flash_mode = opi
board_upload.flash_size = 32MB
board_upload.maximum_size = 33554432
board_build.partitions = default_16MB.csv
; Replaces the board's flags: ARDUINO_USB_MODE=0 selects the TinyUSB CDC, the only one that
; reports line coding (baud) and DTR; ARDUINO_USB_CDC_ON_BOOT=0 keeps `Serial` on UART0 for logs.
board_build.extra_flags =
    -DARDUINO_ESP32S3_DEV
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_RUNNING_CORE=1
    -DARDUINO_EVENT_RUNNING_CORE=1
build_flags =
    -DBUS_TX_PIN=17       ; to URT-2 RX (GPIO33-37 are taken by the octal flash/PSRAM)
    -DBUS_RX_PIN=18       ; from URT-2 TX
    -DRGB_LED_PIN=48      ; DevKitC-1 v1.0; v1.1 boards use 38
    -DWATCHDOG_MS=500
monitor_speed = 115200

[env:native]
platform = native
test_framework = unity
build_src_filter = +<*> -<main.cpp>
build_flags = -std=c++17 -Wall -Wextra
