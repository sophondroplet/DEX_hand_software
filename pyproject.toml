[project]
name = "dexhand-servo-bringup"
version = "0.1.0"
description = "Read-only-first bring-up, diagnostics and control for the Nimo Dexhand SCS0009 / HLS3606 servo bus (FE-URT-2)"
requires-python = ">=3.12"
dependencies = [
    "ftservo-python-sdk==2.0.1",
    "pyserial>=3.5",
    "rich>=13",
]

[project.optional-dependencies]
gui = ["PySide6>=6.7"]

[project.scripts]
dexhand-servo = "dexhand_servo.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-qt>=4.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dexhand_servo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
